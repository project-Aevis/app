<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="cf_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B5C"/>
      <stop offset="50%" stop-color="#FA233B"/>
      <stop offset="100%" stop-color="#D70015"/>
    </linearGradient>
    <linearGradient id="cf_gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="cf_shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#A10018" flood-opacity="0.45"/>
    </filter>
    <filter id="note_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base Squircle with Shadow -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#cf_bg)" filter="url(#cf_shadow)"/>

  <!-- Glossy Reflection Highlight -->
  <path d="M 8 34 C 8 20 20 8 34 8 L 94 8 C 108 8 120 20 120 34 L 120 48 C 80 40 40 40 8 48 Z" fill="url(#cf_gloss)"/>

  <!-- Crisp White Cutefish Double Note Icon -->
  <g filter="url(#note_shadow)">
    <path fill="#FFFFFF" d="M 84 30 L 52 38 L 52 79 C 49.5 77.2 46.2 76 42.5 76 C 34.5 76 28 81.4 28 88 C 28 94.6 34.5 100 42.5 100 C 50.5 100 57 94.6 57 88 L 57 52 L 84 45 L 84 69 C 81.5 67.2 78.2 66 74.5 66 C 66.5 66 60 71.4 60 78 C 60 84.6 66.5 90 74.5 90 C 82.5 90 89 84.6 89 78 L 89 35 C 89 32.2 86.8 30 84 30 Z"/>
  </g>
</svg>
